      try:
        - description: Check the CR's spec was filled in from AWS
          script:
            content: |-
              kubectl get flowlog.ec2.services.k8s.aws flow-log-adopted -n "$NAMESPACE" -o json
            check:
              ($error): null
              (json_parse($stdout)):
                metadata:
                  annotations:
                    services.k8s.aws/adopted: "true"
                spec:
                  logDestination: (join('', ['arn:aws:s3:::', x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.BUCKET]))
                  logDestinationType: s3
                  maxAggregationInterval: 600
                  resourceID: (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.VPC_ID]))
