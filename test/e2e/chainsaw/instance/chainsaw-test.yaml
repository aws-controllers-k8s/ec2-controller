                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.IPV6_SUBNET_ID)
              - name: IPV6_ADDR_1
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.IPV6_ADDR_1)
              - name: IPV6_ADDR_2
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.IPV6_ADDR_2)
              - name: PROFILE_A
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PROFILE_A)
              - name: PROFILE_B
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PROFILE_B)
              - name: PLACEMENT_GROUP_A
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PLACEMENT_GROUP_A)
              - name: PLACEMENT_GROUP_B
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PLACEMENT_GROUP_B)
              - name: TERMINATION_GUARD
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.TERMINATION_GUARD)
            content: |-
              export AWS_DEFAULT_OUTPUT=json AWS_RETRY_MODE=adaptive
              # A call that fails prints its error, and leaves jq no JSON to read
              jq -n \
                --argjson describeInstances "$(aws ec2 describe-instances --instance-ids $AWS_ID --query 'Reservations[0].Instances[0].{imageID: ImageId, instanceType: InstanceType, subnetRef: SubnetId}')" \
                --argjson disableAPITermination "$(aws ec2 describe-instance-attribute --instance-id $AWS_ID --attribute disableApiTermination --query 'DisableApiTermination.Value')" \
                --argjson instanceInitiatedShutdownBehavior "$(aws ec2 describe-instance-attribute --instance-id $AWS_ID --attribute instanceInitiatedShutdownBehavior --query 'InstanceInitiatedShutdownBehavior.Value')" \
                --argjson resource "$(aws ec2 describe-instances --instance-ids $AWS_ID --query 'Reservations[0].Instances[0]')" \
                '$ARGS.named'
            check:
              ($error): null
              (json_parse($stdout)):
                describeInstances:
                  imageID: (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.AMI_ID]))
                  instanceType: t3.micro
                  subnetRef: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'Subnet', $namespace, 'instance-subnet').status.subnetID)
                disableAPITermination: false
                instanceInitiatedShutdownBehavior: stop
                resource:
                  (sort(SecurityGroups[].GroupId)):
                    - (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.SG_A_ID]))
      catch:
        - describe:
            apiVersion: ec2.services.k8s.aws/v1alpha1
            kind: Instance
            name: ($name)
    - name: delete
      use:
        template: ../_templates/delete.yaml
        with:
          bindings:
            - name: describeCommand
              value: aws ec2 describe-instances --instance-ids $AWS_ID
            - name: notFoundCode
              value: InvalidInstanceID.NotFound
            - name: deletedQuery
              value: Reservations[0].Instances[0].State.Name == 'terminated'
            - name: waitCommand
              value: aws ec2 wait instance-terminated --instance-ids $AWS_ID
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: instance-adoption
spec:
  description: Adopts a Instance left behind by a CR with deletion-policy retain, then deletes it.
  bindings:
    - name: suffix
      value: (random('[a-z0-9]{8}'))
    - name: apiVersion
      value: ec2.services.k8s.aws/v1alpha1
    - name: kind
      value: Instance
    - name: name
      value: instance-adopted
    - name: idPath
      value: '{.status.instanceID}'
  steps:
    - name: dependencies
      try:
        - description: Create the VPC instance-vpc it depends on
          apply:
            file: dependency-instance-vpc.yaml
        - description: Create the Subnet instance-subnet it depends on
          apply:
            file: dependency-instance-subnet.yaml
        - description: Create the SecurityGroup instance-sg-a it depends on
          apply:
            file: dependency-instance-sg-a.yaml
        - description: Create the SecurityGroup instance-sg-b it depends on
          apply:
            file: dependency-instance-sg-b.yaml
        - description: Wait for VPC instance-vpc to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: instance-vpc
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for Subnet instance-subnet to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: instance-subnet
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for SecurityGroup instance-sg-a to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: instance-sg-a
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for SecurityGroup instance-sg-b to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: instance-sg-b
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
    - name: values
      try:
        - description: Work out the values the specs use
          script:
            env:
              - name: SUFFIX
                value: ($suffix)
            content: |
              set -eu
              export SUFFIX NAMESPACE AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
              kubectl create configmap ack-test-values -n "$NAMESPACE" >/dev/null

              SG_A_ID=$(sh -euc 'kubectl get securitygroup instance-sg-a -n $NAMESPACE -o jsonpath='\''{.status.id}'\''') || { echo "value SG_A_ID: command failed" >&2; exit 1; }
              [ -n "$SG_A_ID" ] || { echo "value SG_A_ID: command printed nothing" >&2; exit 1; }
              export SG_A_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$SG_A_ID" '{data: {SG_A_ID: $v}}')" >/dev/null

              SG_B_ID=$(sh -euc 'kubectl get securitygroup instance-sg-b -n $NAMESPACE -o jsonpath='\''{.status.id}'\''') || { echo "value SG_B_ID: command failed" >&2; exit 1; }
              [ -n "$SG_B_ID" ] || { echo "value SG_B_ID: command printed nothing" >&2; exit 1; }
              export SG_B_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$SG_B_ID" '{data: {SG_B_ID: $v}}')" >/dev/null

              AMI_ID=$(sh -euc 'aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 --query Parameter.Value --output text') || { echo "value AMI_ID: command failed" >&2; exit 1; }
              [ -n "$AMI_ID" ] || { echo "value AMI_ID: command printed nothing" >&2; exit 1; }
              export AMI_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$AMI_ID" '{data: {AMI_ID: $v}}')" >/dev/null

              VPC_ID=$(sh -euc 'kubectl get vpc instance-vpc -n $NAMESPACE -o jsonpath='\''{.status.vpcID}'\''') || { echo "value VPC_ID: command failed" >&2; exit 1; }
              [ -n "$VPC_ID" ] || { echo "value VPC_ID: command printed nothing" >&2; exit 1; }
              export VPC_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$VPC_ID" '{data: {VPC_ID: $v}}')" >/dev/null

              VPC_IPV6_CIDR=$(sh -euc 'for i in $(seq 1 30); do cidr=$(kubectl get vpc instance-vpc -n $NAMESPACE -o jsonpath='\''{.status.ipv6CIDRBlockAssociationSet[0].ipv6CIDRBlock}'\''); [ -n "$cidr" ] && echo "$cidr" && exit 0; sleep 2; done; exit 1') || { echo "value VPC_IPV6_CIDR: command failed" >&2; exit 1; }
              [ -n "$VPC_IPV6_CIDR" ] || { echo "value VPC_IPV6_CIDR: command printed nothing" >&2; exit 1; }
              export VPC_IPV6_CIDR
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$VPC_IPV6_CIDR" '{data: {VPC_IPV6_CIDR: $v}}')" >/dev/null

              IPV6_SUBNET_ID=$(sh -euc 'aws ec2 create-subnet --vpc-id $VPC_ID --cidr-block 10.0.2.0/24 --ipv6-cidr-block "$(echo "$VPC_IPV6_CIDR" | sed '\''s|00::/56$|01::/64|'\'')" --tag-specifications "ResourceType=subnet,Tags=[{Key=services.k8s.aws/namespace,Value=$NAMESPACE}]" --query Subnet.SubnetId --output text') || { echo "value IPV6_SUBNET_ID: command failed" >&2; exit 1; }
              [ -n "$IPV6_SUBNET_ID" ] || { echo "value IPV6_SUBNET_ID: command printed nothing" >&2; exit 1; }
              export IPV6_SUBNET_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$IPV6_SUBNET_ID" '{data: {IPV6_SUBNET_ID: $v}}')" >/dev/null

              IPV6_ADDR_1=$(sh -euc 'echo "$VPC_IPV6_CIDR" | sed '\''s|00::/56$|01::10|'\''') || { echo "value IPV6_ADDR_1: command failed" >&2; exit 1; }
              [ -n "$IPV6_ADDR_1" ] || { echo "value IPV6_ADDR_1: command printed nothing" >&2; exit 1; }
              export IPV6_ADDR_1
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$IPV6_ADDR_1" '{data: {IPV6_ADDR_1: $v}}')" >/dev/null

              IPV6_ADDR_2=$(sh -euc 'echo "$VPC_IPV6_CIDR" | sed '\''s|00::/56$|01::11|'\''') || { echo "value IPV6_ADDR_2: command failed" >&2; exit 1; }
              [ -n "$IPV6_ADDR_2" ] || { echo "value IPV6_ADDR_2: command printed nothing" >&2; exit 1; }
              export IPV6_ADDR_2
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$IPV6_ADDR_2" '{data: {IPV6_ADDR_2: $v}}')" >/dev/null

              PROFILE_A=$(sh -euc 'aws iam create-role --role-name ack-chainsaw-a-$SUFFIX --assume-role-policy-document '\''{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'\'' --tags Key=services.k8s.aws/namespace,Value=$NAMESPACE >/dev/null && aws iam create-instance-profile --instance-profile-name ack-chainsaw-a-$SUFFIX --tags Key=services.k8s.aws/namespace,Value=$NAMESPACE >/dev/null && aws iam add-role-to-instance-profile --instance-profile-name ack-chainsaw-a-$SUFFIX --role-name ack-chainsaw-a-$SUFFIX && sleep 15 && echo ack-chainsaw-a-$SUFFIX') || { echo "value PROFILE_A: command failed" >&2; exit 1; }
              [ -n "$PROFILE_A" ] || { echo "value PROFILE_A: command printed nothing" >&2; exit 1; }
              export PROFILE_A
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$PROFILE_A" '{data: {PROFILE_A: $v}}')" >/dev/null

              PROFILE_B=$(sh -euc 'aws iam create-role --role-name ack-chainsaw-b-$SUFFIX --assume-role-policy-document '\''{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}'\'' --tags Key=services.k8s.aws/namespace,Value=$NAMESPACE >/dev/null && aws iam create-instance-profile --instance-profile-name ack-chainsaw-b-$SUFFIX --tags Key=services.k8s.aws/namespace,Value=$NAMESPACE >/dev/null && aws iam add-role-to-instance-profile --instance-profile-name ack-chainsaw-b-$SUFFIX --role-name ack-chainsaw-b-$SUFFIX && sleep 15 && echo ack-chainsaw-b-$SUFFIX') || { echo "value PROFILE_B: command failed" >&2; exit 1; }
              [ -n "$PROFILE_B" ] || { echo "value PROFILE_B: command printed nothing" >&2; exit 1; }
              export PROFILE_B
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$PROFILE_B" '{data: {PROFILE_B: $v}}')" >/dev/null

              PLACEMENT_GROUP_A=$(sh -euc 'aws ec2 create-placement-group --group-name ack-chainsaw-a-$SUFFIX --strategy spread --tag-specifications "ResourceType=placement-group,Tags=[{Key=services.k8s.aws/namespace,Value=$NAMESPACE}]" >/dev/null && echo ack-chainsaw-a-$SUFFIX') || { echo "value PLACEMENT_GROUP_A: command failed" >&2; exit 1; }
              [ -n "$PLACEMENT_GROUP_A" ] || { echo "value PLACEMENT_GROUP_A: command printed nothing" >&2; exit 1; }
              export PLACEMENT_GROUP_A
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$PLACEMENT_GROUP_A" '{data: {PLACEMENT_GROUP_A: $v}}')" >/dev/null

              PLACEMENT_GROUP_B=$(sh -euc 'aws ec2 create-placement-group --group-name ack-chainsaw-b-$SUFFIX --strategy spread --tag-specifications "ResourceType=placement-group,Tags=[{Key=services.k8s.aws/namespace,Value=$NAMESPACE}]" >/dev/null && echo ack-chainsaw-b-$SUFFIX') || { echo "value PLACEMENT_GROUP_B: command failed" >&2; exit 1; }
              [ -n "$PLACEMENT_GROUP_B" ] || { echo "value PLACEMENT_GROUP_B: command printed nothing" >&2; exit 1; }
              export PLACEMENT_GROUP_B
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$PLACEMENT_GROUP_B" '{data: {PLACEMENT_GROUP_B: $v}}')" >/dev/null

              TERMINATION_GUARD=$(sh -euc 'echo none') || { echo "value TERMINATION_GUARD: command failed" >&2; exit 1; }
              [ -n "$TERMINATION_GUARD" ] || { echo "value TERMINATION_GUARD: command printed nothing" >&2; exit 1; }
              export TERMINATION_GUARD
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$TERMINATION_GUARD" '{data: {TERMINATION_GUARD: $v}}')" >/dev/null
      cleanup:
        - description: Clean up what the values' commands created
          script:
            env:
              - name: SUFFIX
                value: ($suffix)
            content: |
              set -u
              export SUFFIX NAMESPACE AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
              eval "$(kubectl get configmap ack-test-values -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.data // {} | to_entries[] | "export \(.key)=\(.value | @sh)"')"
              failed=0

              if [ -n "${TERMINATION_GUARD:-}" ]; then sh -euc 'for i in $(aws ec2 describe-instances --filters Name=tag:services.k8s.aws/namespace,Values=$NAMESPACE Name=instance-state-name,Values=pending,running,stopping,stopped --query '\''Reservations[].Instances[].InstanceId'\'' --output text); do aws ec2 modify-instance-attribute --instance-id $i --no-disable-api-termination; aws ec2 terminate-instances --instance-ids $i >/dev/null; done' || { echo "cleanup of TERMINATION_GUARD failed" >&2; failed=1; }; fi

              if [ -n "${PLACEMENT_GROUP_B:-}" ]; then sh -euc 'for i in $(seq 1 30); do out=$(aws ec2 delete-placement-group --group-name $PLACEMENT_GROUP_B 2>&1) && exit 0; case "$out" in *InUse*) sleep 10 ;; *InvalidPlacementGroup.Unknown*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac; done; echo "$out" >&2; exit 1' || { echo "cleanup of PLACEMENT_GROUP_B failed" >&2; failed=1; }; fi

              if [ -n "${PLACEMENT_GROUP_A:-}" ]; then sh -euc 'for i in $(seq 1 30); do out=$(aws ec2 delete-placement-group --group-name $PLACEMENT_GROUP_A 2>&1) && exit 0; case "$out" in *InUse*) sleep 10 ;; *InvalidPlacementGroup.Unknown*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac; done; echo "$out" >&2; exit 1' || { echo "cleanup of PLACEMENT_GROUP_A failed" >&2; failed=1; }; fi

              if [ -n "${PROFILE_B:-}" ]; then sh -euc 'aws iam remove-role-from-instance-profile --instance-profile-name $PROFILE_B --role-name $PROFILE_B 2>/dev/null || true; for i in $(seq 1 30); do out=$(aws iam delete-instance-profile --instance-profile-name $PROFILE_B 2>&1) && break; case "$out" in *DeleteConflict*) sleep 10 ;; *NoSuchEntity*) break ;; *) echo "$out" >&2; exit 1 ;; esac; done; aws iam delete-role --role-name $PROFILE_B 2>&1 | grep -v NoSuchEntity >&2 || true' || { echo "cleanup of PROFILE_B failed" >&2; failed=1; }; fi

              if [ -n "${PROFILE_A:-}" ]; then sh -euc 'aws iam remove-role-from-instance-profile --instance-profile-name $PROFILE_A --role-name $PROFILE_A 2>/dev/null || true; for i in $(seq 1 30); do out=$(aws iam delete-instance-profile --instance-profile-name $PROFILE_A 2>&1) && break; case "$out" in *DeleteConflict*) sleep 10 ;; *NoSuchEntity*) break ;; *) echo "$out" >&2; exit 1 ;; esac; done; aws iam delete-role --role-name $PROFILE_A 2>&1 | grep -v NoSuchEntity >&2 || true' || { echo "cleanup of PROFILE_A failed" >&2; failed=1; }; fi

              if [ -n "${IPV6_SUBNET_ID:-}" ]; then sh -euc 'for i in $(seq 1 30); do out=$(aws ec2 delete-subnet --subnet-id $IPV6_SUBNET_ID 2>&1) && exit 0; case "$out" in *DependencyViolation*) sleep 10 ;; *InvalidSubnetID.NotFound*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac; done; echo "$out" >&2; exit 1' || { echo "cleanup of IPV6_SUBNET_ID failed" >&2; failed=1; }; fi
              exit $failed
    - name: create-source
      try:
        - description: Create a Instance to adopt, through a CR with deletion-policy retain
          apply:
            file: instance-adopt-source.yaml
    - name: wait-synced-source
      use:
        template: ../_templates/assert-synced.yaml
        with:
          bindings:
            - name: name
              value: instance-adopt-source
    - name: adopt
      try:
        - description: Record the AWS ID
          script:
            content: |-
              kubectl get instance.ec2.services.k8s.aws instance-adopt-source -n "$NAMESPACE" -o jsonpath='{.status.instanceID}'
            outputs:
              - name: sourceID
                value: (trim_space($stdout))
        - description: Delete the CR, leaving the Instance in AWS
          delete:
            ref:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Instance
              name: instance-adopt-source
        - description: Adopt the Instance
          apply:
            file: instance-adopted.yaml
      cleanup:
        - description: Delete the Instance if it's still in AWS
          script:
            env:
              - name: AWS_ID
                value: ($sourceID)
            content: |-
              aws ec2 terminate-instances --instance-ids $AWS_ID >/dev/null 2>&1 || true
    - name: wait-synced
      use:
        template: ../_templates/assert-synced.yaml
    - name: check-adopted
      try:
        - description: Read back from AWS
          script:
            env:
              - name: AWS_ID
                value: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'Instance', $namespace, $name).status.instanceID)
              - name: SUFFIX
                value: ($suffix)
              - name: SG_A_ID
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.SG_A_ID)
              - name: SG_B_ID
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.SG_B_ID)
              - name: AMI_ID
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.AMI_ID)
              - name: VPC_ID
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.VPC_ID)
              - name: VPC_IPV6_CIDR
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.VPC_IPV6_CIDR)
              - name: IPV6_SUBNET_ID
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.IPV6_SUBNET_ID)
              - name: IPV6_ADDR_1
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.IPV6_ADDR_1)
              - name: IPV6_ADDR_2
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.IPV6_ADDR_2)
              - name: PROFILE_A
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PROFILE_A)
              - name: PROFILE_B
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PROFILE_B)
              - name: PLACEMENT_GROUP_A
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PLACEMENT_GROUP_A)
              - name: PLACEMENT_GROUP_B
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.PLACEMENT_GROUP_B)
              - name: TERMINATION_GUARD
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.TERMINATION_GUARD)
            content: |-
              export AWS_DEFAULT_OUTPUT=json AWS_RETRY_MODE=adaptive
              # A call that fails prints its error, and leaves jq no JSON to read
              jq -n \
                --argjson describeInstances "$(aws ec2 describe-instances --instance-ids $AWS_ID --query 'Reservations[0].Instances[0].{imageID: ImageId, instanceType: InstanceType, subnetRef: SubnetId, tags: sort_by(Tags[?!starts_with(Key, `"services.k8s.aws/"`)], &Key), systemTags: sort(Tags[?starts_with(Key, `"services.k8s.aws/"`)].Key)}')" \
                --argjson instanceInitiatedShutdownBehavior "$(aws ec2 describe-instance-attribute --instance-id $AWS_ID --attribute instanceInitiatedShutdownBehavior --query 'InstanceInitiatedShutdownBehavior.Value')" \
                --argjson resource "$(aws ec2 describe-instances --instance-ids $AWS_ID --query 'Reservations[0].Instances[0]')" \
                '$ARGS.named'
            check:
              ($error): null
              (json_parse($stdout)):
                describeInstances:
                  imageID: (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.AMI_ID]))
                  instanceType: t3.micro
                  subnetRef: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'Subnet', $namespace, 'instance-subnet').status.subnetID)
                  systemTags:
                    - services.k8s.aws/controller-version
                    - services.k8s.aws/namespace
                  tags:
                    - Key: Name
                      Value: (join('', ['ack-chainsaw-', $suffix]))
                instanceInitiatedShutdownBehavior: stop
                resource:
                  (sort(SecurityGroups[].GroupId)):
                    - (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.SG_A_ID]))
      catch:
        - describe:
            apiVersion: ec2.services.k8s.aws/v1alpha1
            kind: Instance
            name: ($name)
    - name: check-adopted-spec
      try:
        - description: Check the CR's spec was filled in from AWS
          script:
            content: |-
              kubectl get instance.ec2.services.k8s.aws instance-adopted -n "$NAMESPACE" -o json
            check:
              ($error): null
              (json_parse($stdout)):
                metadata:
                  annotations:
                    services.k8s.aws/adopted: "true"
                spec:
                  imageID: (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.AMI_ID]))
                  instanceInitiatedShutdownBehavior: stop
                  instanceType: t3.micro
                  securityGroupIDs:
                    - (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.SG_A_ID]))
                  subnetID: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'Subnet', $namespace, 'instance-subnet').status.subnetID)
                  tags:
                    - key: Name
                      value: (join('', ['ack-chainsaw-', $suffix]))
    - name: delete
      use:
        template: ../_templates/delete.yaml
        with:
          bindings:
            - name: describeCommand
              value: aws ec2 describe-instances --instance-ids $AWS_ID
            - name: notFoundCode
              value: InvalidInstanceID.NotFound
            - name: deletedQuery
              value: Reservations[0].Instances[0].State.Name == 'terminated'
            - name: waitCommand
              value: aws ec2 wait instance-terminated --instance-ids $AWS_ID
