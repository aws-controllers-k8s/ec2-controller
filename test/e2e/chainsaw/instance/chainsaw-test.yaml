    - name: check-update-1
      try:
        - description: Read back from AWS
          script:
            env:
              - name: AWS_ID
                value: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'Instance', $namespace, $name).status.instanceID)
              - name: SUFFIX
