                  name: (join('', ['ack-chainsaw-', $suffix]))
                  systemTags:
                    - services.k8s.aws/controller-version
                    - services.k8s.aws/namespace
                  tags:
                    - Key: initialtagkey
                      Value: initialtagvalue
                entries:
                  - cidr: 10.0.0.0/24
                    description: Internal network A
                  - cidr: 10.0.1.0/24
                    description: Internal network B
      catch:
        - describe:
            apiVersion: ec2.services.k8s.aws/v1alpha1
            kind: ManagedPrefixList
            name: ($name)
    - name: check-adopted-spec
      try:
        - description: Check the CR's spec was filled in from AWS
          script:
            content: |-
              kubectl get managedprefixlist.ec2.services.k8s.aws managed-prefix-list-adopted -n "$NAMESPACE" -o json
            check:
              ($error): null
              (json_parse($stdout)):
                metadata:
                  annotations:
                    services.k8s.aws/adopted: "true"
                spec:
                  addressFamily: IPv4
                  entries:
                    - cidr: 10.0.0.0/24
                      description: Internal network A
                    - cidr: 10.0.1.0/24
                      description: Internal network B
                  maxEntries: 5
                  name: (join('', ['ack-chainsaw-', $suffix]))
                  tags:
                    - key: initialtagkey
                      value: initialtagvalue
    - name: delete
      use:
        template: ../_templates/delete.yaml
        with:
          bindings:
            - name: describeCommand
              value: aws ec2 describe-managed-prefix-lists --prefix-list-ids $AWS_ID
            - name: notFoundCode
              value: InvalidPrefixListID.NotFound
