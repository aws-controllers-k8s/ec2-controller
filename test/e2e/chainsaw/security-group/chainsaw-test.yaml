                '$ARGS.named'
            check:
              ($error): null
              (json_parse($stdout)):
                describeSecurityGroups:
                  description: Created by a generated ACK Chainsaw test
                  ingressRules:
                    - FromPort: 443
                      IpProtocol: tcp
                      IpRanges:
                        - CidrIp: 10.0.0.0/16
                          Description: https
                      ToPort: 443
                  name: (join('', ['ack-chainsaw-', $suffix]))
                  systemTags:
                    - services.k8s.aws/controller-version
                    - services.k8s.aws/namespace
                  tags:
                    - Key: initialtagkey
                      Value: initialtagvalue
                  vpcRef: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPC', $namespace, 'sg-vpc').status.vpcID)
      catch:
        - describe:
            apiVersion: ec2.services.k8s.aws/v1alpha1
            kind: SecurityGroup
            name: ($name)
    - name: check-adopted-spec
      try:
        - description: Check the CR's spec was filled in from AWS
          script:
            content: |-
              kubectl get securitygroup.ec2.services.k8s.aws security-group-adopted -n "$NAMESPACE" -o json
            check:
              ($error): null
              (json_parse($stdout)):
                metadata:
                  annotations:
                    services.k8s.aws/adopted: "true"
                spec:
                  description: Created by a generated ACK Chainsaw test
                  ingressRules:
                    - fromPort: 443
                      ipProtocol: tcp
                      ipRanges:
                        - cidrIP: 10.0.0.0/16
                          description: https
                      toPort: 443
                  name: (join('', ['ack-chainsaw-', $suffix]))
                  tags:
                    - key: initialtagkey
                      value: initialtagvalue
                  vpcID: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPC', $namespace, 'sg-vpc').status.vpcID)
    - name: delete
      use:
        template: ../_templates/delete.yaml
        with:
          bindings:
            - name: describeCommand
              value: aws ec2 describe-security-groups --group-ids $AWS_ID
