apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: security-group-adoption
spec:
  description: Adopts a SecurityGroup left behind by a CR with deletion-policy retain, then deletes it.
  bindings:
    - name: suffix
      value: (random('[a-z0-9]{8}'))
    - name: apiVersion
      value: ec2.services.k8s.aws/v1alpha1
    - name: kind
      value: SecurityGroup
    - name: name
      value: security-group-adopted
    - name: idPath
      value: '{.status.id}'
  steps:
    - name: create-source
      try:
        - description: Create the VPC sg-vpc it depends on
          apply:
            file: dependency-sg-vpc.yaml
        - description: Create a SecurityGroup to adopt, through a CR with deletion-policy retain
          apply:
            file: security-group-adopt-source.yaml
    - name: wait-synced-source
      use:
        template: ../_templates/assert-synced.yaml
        with:
          bindings:
            - name: name
              value: security-group-adopt-source
    - name: adopt
      try:
        - description: Record the AWS ID
          script:
            content: |-
              kubectl get securitygroup.ec2.services.k8s.aws security-group-adopt-source -n "$NAMESPACE" -o jsonpath='{.status.id}'
            outputs:
              - name: sourceID
                value: (trim_space($stdout))
        - description: Delete the CR, leaving the SecurityGroup in AWS
          delete:
            ref:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              name: security-group-adopt-source
        - description: Adopt the SecurityGroup
          apply:
            file: security-group-adopted.yaml
      cleanup:
        - description: Delete the SecurityGroup if it's still in AWS
          script:
            env:
              - name: AWS_ID
                value: ($sourceID)
            content: |-
              aws ec2 delete-security-group --group-id $AWS_ID >/dev/null 2>&1 || true
    - name: wait-synced
      use:
        template: ../_templates/assert-synced.yaml
    - name: check-adopted
      try:
        - description: Read back from AWS
          script:
            env:
              - name: AWS_ID
                value: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'SecurityGroup', $namespace, $name).status.id)
