          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: vpce-subnet-a
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for Subnet vpce-subnet-b to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
