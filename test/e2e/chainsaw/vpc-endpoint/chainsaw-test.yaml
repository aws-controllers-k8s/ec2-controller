        - description: Wait for SecurityGroup vpce-sg-b to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: vpce-sg-b
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
