apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vpc-endpoint-adoption
spec:
  description: Adopts a VPCEndpoint left behind by a CR with deletion-policy retain, then deletes it.
  bindings:
    - name: suffix
      value: (random('[a-z0-9]{8}'))
    - name: apiVersion
      value: ec2.services.k8s.aws/v1alpha1
    - name: kind
      value: VPCEndpoint
    - name: name
      value: vpc-endpoint-adopted
    - name: idPath
      value: '{.status.vpcEndpointID}'
  steps:
    - name: dependencies
      try:
        - description: Create the VPC vpce-vpc it depends on
          apply:
            file: dependency-vpce-vpc.yaml
        - description: Create the RouteTable vpce-rt-a it depends on
          apply:
            file: dependency-vpce-rt-a.yaml
        - description: Create the RouteTable vpce-rt-b it depends on
          apply:
            file: dependency-vpce-rt-b.yaml
        - description: Wait for VPC vpce-vpc to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: vpce-vpc
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for RouteTable vpce-rt-a to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: vpce-rt-a
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for RouteTable vpce-rt-b to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: vpce-rt-b
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
    - name: values
      try:
        - description: Work out the values the specs use
          script:
            env:
              - name: SUFFIX
                value: ($suffix)
            content: |
              set -eu
              export SUFFIX NAMESPACE AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
              kubectl create configmap ack-test-values -n "$NAMESPACE" >/dev/null

              REGION=$(sh -euc 'echo "$AWS_REGION"') || { echo "value REGION: command failed" >&2; exit 1; }
              [ -n "$REGION" ] || { echo "value REGION: command printed nothing" >&2; exit 1; }
              export REGION
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$REGION" '{data: {REGION: $v}}')" >/dev/null
    - name: create-source
      try:
        - description: Create a VPCEndpoint to adopt, through a CR with deletion-policy retain
          apply:
            file: vpc-endpoint-adopt-source.yaml
    - name: wait-synced-source
      use:
        template: ../_templates/assert-synced.yaml
        with:
          bindings:
            - name: name
              value: vpc-endpoint-adopt-source
    - name: adopt
      try:
        - description: Record the AWS ID
          script:
            content: |-
              kubectl get vpcendpoint.ec2.services.k8s.aws vpc-endpoint-adopt-source -n "$NAMESPACE" -o jsonpath='{.status.vpcEndpointID}'
            outputs:
              - name: sourceID
                value: (trim_space($stdout))
        - description: Delete the CR, leaving the VPCEndpoint in AWS
          delete:
            ref:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              name: vpc-endpoint-adopt-source
        - description: Adopt the VPCEndpoint
          apply:
            file: vpc-endpoint-adopted.yaml
      cleanup:
        - description: Delete the VPCEndpoint if it's still in AWS
          script:
            env:
              - name: AWS_ID
                value: ($sourceID)
            content: |-
              aws ec2 delete-vpc-endpoints --vpc-endpoint-ids $AWS_ID >/dev/null 2>&1 || true
    - name: wait-synced
      use:
        template: ../_templates/assert-synced.yaml
    - name: check-adopted
      try:
        - description: Read back from AWS
          script:
            env:
              - name: AWS_ID
                value: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPCEndpoint', $namespace, $name).status.vpcEndpointID)
              - name: SUFFIX
                value: ($suffix)
              - name: REGION
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.REGION)
            content: |-
              export AWS_DEFAULT_OUTPUT=json AWS_RETRY_MODE=adaptive
              # A call that fails prints its error, and leaves jq no JSON to read
              jq -n \
                --argjson describeVPCEndpoints "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID --query 'VpcEndpoints[0].{routeTableRefs: sort(RouteTableIds), serviceName: ServiceName, tags: sort_by(Tags[?!starts_with(Key, `"services.k8s.aws/"`)], &Key), systemTags: sort(Tags[?starts_with(Key, `"services.k8s.aws/"`)].Key), vpcEndpointType: VpcEndpointType, vpcRef: VpcId}')" \
                --argjson resource "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID --query 'VpcEndpoints[0]')" \
                '$ARGS.named'
            check:
              ($error): null
              (json_parse($stdout)):
                describeVPCEndpoints:
                  routeTableRefs: (sort([x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'RouteTable', $namespace, 'vpce-rt-a').status.routeTableID]))
                  serviceName: (join('', ['com.amazonaws.', x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.REGION, '.s3']))
                  systemTags:
                    - services.k8s.aws/controller-version
                    - services.k8s.aws/namespace
                  tags:
                    - Key: initialtagkey
                      Value: initialtagvalue
                  vpcEndpointType: Gateway
                  vpcRef: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPC', $namespace, 'vpce-vpc').status.vpcID)
                resource:
                  (json_parse(PolicyDocument)):
                    Statement:
                      - Action: '*'
                        Effect: Allow
                        Principal: '*'
                        Resource: '*'
                    Version: "2012-10-17"
      catch:
        - describe:
            apiVersion: ec2.services.k8s.aws/v1alpha1
            kind: VPCEndpoint
            name: ($name)
    - name: check-adopted-spec
      try:
        - description: Check the CR's spec was filled in from AWS
          script:
            content: |-
              kubectl get vpcendpoint.ec2.services.k8s.aws vpc-endpoint-adopted -n "$NAMESPACE" -o json
            check:
              ($error): null
              (json_parse($stdout)):
                metadata:
                  annotations:
                    services.k8s.aws/adopted: "true"
                spec:
                  (json_parse(policyDocument)):
                    Statement:
                      - Action: '*'
                        Effect: Allow
                        Principal: '*'
                        Resource: '*'
                    Version: "2012-10-17"
                  serviceName: (join('', ['com.amazonaws.', x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.REGION, '.s3']))
                  tags:
                    - key: initialtagkey
                      value: initialtagvalue
                  vpcEndpointType: Gateway
                  vpcID: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPC', $namespace, 'vpce-vpc').status.vpcID)
    - name: delete
      use:
        template: ../_templates/delete.yaml
        with:
          bindings:
            - name: describeCommand
              value: aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID
            - name: notFoundCode
              value: InvalidVpcEndpointId.NotFound
