                    - (join('', [x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.DS_SUBNET_B]))
                  vpcEndpointType: Interface
                  vpcRef: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPC', $namespace, 'vpce-vpc').status.vpcID)
                resource:
                  (sort(Groups[].GroupId)): (sort([x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'SecurityGroup', $namespace, 'vpce-sg-a').status.id]))
      catch:
        - describe:
            apiVersion: ec2.services.k8s.aws/v1alpha1
            kind: VPCEndpoint
            name: ($name)
    - name: update-1
      description: Change ipAddressType
