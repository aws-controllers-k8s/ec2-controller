---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vpc-endpoint-adoption
spec:
  description: Adopts a VPCEndpoint left behind by a CR with deletion-policy retain, then deletes it.
  bindings:
    - name: suffix
      value: (random('[a-z0-9]{8}'))
    - name: apiVersion
      value: ec2.services.k8s.aws/v1alpha1
    - name: kind
      value: VPCEndpoint
    - name: name
      value: vpc-endpoint-adopted
    - name: idPath
      value: '{.status.vpcEndpointID}'
  steps:
    - name: dependencies
      try:
        - description: Create the VPC vpce-vpc it depends on
          apply:
            file: dependency-vpce-vpc.yaml
        - description: Create the Subnet vpce-subnet-a it depends on
          apply:
            file: dependency-vpce-subnet-a.yaml
        - description: Create the Subnet vpce-subnet-b it depends on
          apply:
            file: dependency-vpce-subnet-b.yaml
        - description: Create the SecurityGroup vpce-sg-a it depends on
          apply:
            file: dependency-vpce-sg-a.yaml
        - description: Create the SecurityGroup vpce-sg-b it depends on
          apply:
            file: dependency-vpce-sg-b.yaml
        - description: Create the RouteTable vpce-rt-a it depends on
          apply:
            file: dependency-vpce-rt-a.yaml
        - description: Create the RouteTable vpce-rt-b it depends on
          apply:
            file: dependency-vpce-rt-b.yaml
        - description: Wait for VPC vpce-vpc to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: vpce-vpc
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for Subnet vpce-subnet-a to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: vpce-subnet-a
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for Subnet vpce-subnet-b to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: Subnet
              metadata:
                name: vpce-subnet-b
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for SecurityGroup vpce-sg-a to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: vpce-sg-a
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for SecurityGroup vpce-sg-b to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: SecurityGroup
              metadata:
                name: vpce-sg-b
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for RouteTable vpce-rt-a to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: vpce-rt-a
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
        - description: Wait for RouteTable vpce-rt-b to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: RouteTable
              metadata:
                name: vpce-rt-b
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
    - name: values
      try:
        - description: Work out the values the specs use
          script:
            env:
              - name: SUFFIX
                value: ($suffix)
            content: |
              set -eu
              export SUFFIX NAMESPACE AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
              kubectl create configmap ack-test-values -n "$NAMESPACE" >/dev/null

              REGION=$(sh -euc 'echo "$AWS_REGION"') || { echo "value REGION: command failed" >&2; exit 1; }
              [ -n "$REGION" ] || { echo "value REGION: command printed nothing" >&2; exit 1; }
              export REGION
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$REGION" '{data: {REGION: $v}}')" >/dev/null

              VPC_ID=$(sh -euc 'kubectl get vpc vpce-vpc -n $NAMESPACE -o jsonpath='\''{.status.vpcID}'\''') || { echo "value VPC_ID: command failed" >&2; exit 1; }
              [ -n "$VPC_ID" ] || { echo "value VPC_ID: command printed nothing" >&2; exit 1; }
              export VPC_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$VPC_ID" '{data: {VPC_ID: $v}}')" >/dev/null

              VPC_IPV6_CIDR=$(sh -euc 'for i in $(seq 1 30); do cidr=$(kubectl get vpc vpce-vpc -n $NAMESPACE -o jsonpath='\''{.status.ipv6CIDRBlockAssociationSet[0].ipv6CIDRBlock}'\''); [ -n "$cidr" ] && echo "$cidr" && exit 0; sleep 2; done; exit 1') || { echo "value VPC_IPV6_CIDR: command failed" >&2; exit 1; }
              [ -n "$VPC_IPV6_CIDR" ] || { echo "value VPC_IPV6_CIDR: command printed nothing" >&2; exit 1; }
              export VPC_IPV6_CIDR
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$VPC_IPV6_CIDR" '{data: {VPC_IPV6_CIDR: $v}}')" >/dev/null

              AZ_A=$(sh -euc 'aws ec2 describe-availability-zones --filters Name=state,Values=available Name=zone-type,Values=availability-zone --query '\''sort(AvailabilityZones[].ZoneName)[0]'\'' --output text') || { echo "value AZ_A: command failed" >&2; exit 1; }
              [ -n "$AZ_A" ] || { echo "value AZ_A: command printed nothing" >&2; exit 1; }
              export AZ_A
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$AZ_A" '{data: {AZ_A: $v}}')" >/dev/null

              AZ_B=$(sh -euc 'aws ec2 describe-availability-zones --filters Name=state,Values=available Name=zone-type,Values=availability-zone --query '\''sort(AvailabilityZones[].ZoneName)[1]'\'' --output text') || { echo "value AZ_B: command failed" >&2; exit 1; }
              [ -n "$AZ_B" ] || { echo "value AZ_B: command printed nothing" >&2; exit 1; }
              export AZ_B
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$AZ_B" '{data: {AZ_B: $v}}')" >/dev/null

              DS_SUBNET_A=$(sh -euc 'aws ec2 create-subnet --vpc-id $VPC_ID --availability-zone $AZ_A --cidr-block 10.0.3.0/24 --ipv6-cidr-block "$(echo "$VPC_IPV6_CIDR" | sed '\''s|00::/56$|03::/64|'\'')" --tag-specifications "ResourceType=subnet,Tags=[{Key=services.k8s.aws/namespace,Value=$NAMESPACE}]" --query Subnet.SubnetId --output text') || { echo "value DS_SUBNET_A: command failed" >&2; exit 1; }
              [ -n "$DS_SUBNET_A" ] || { echo "value DS_SUBNET_A: command printed nothing" >&2; exit 1; }
              export DS_SUBNET_A
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$DS_SUBNET_A" '{data: {DS_SUBNET_A: $v}}')" >/dev/null

              DS_SUBNET_B=$(sh -euc 'aws ec2 create-subnet --vpc-id $VPC_ID --availability-zone $AZ_B --cidr-block 10.0.4.0/24 --ipv6-cidr-block "$(echo "$VPC_IPV6_CIDR" | sed '\''s|00::/56$|04::/64|'\'')" --tag-specifications "ResourceType=subnet,Tags=[{Key=services.k8s.aws/namespace,Value=$NAMESPACE}]" --query Subnet.SubnetId --output text') || { echo "value DS_SUBNET_B: command failed" >&2; exit 1; }
              [ -n "$DS_SUBNET_B" ] || { echo "value DS_SUBNET_B: command printed nothing" >&2; exit 1; }
              export DS_SUBNET_B
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$DS_SUBNET_B" '{data: {DS_SUBNET_B: $v}}')" >/dev/null
      cleanup:
        - description: Clean up what the values' commands created
          script:
            env:
              - name: SUFFIX
                value: ($suffix)
            content: |
              set -u
              export SUFFIX NAMESPACE AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
              eval "$(kubectl get configmap ack-test-values -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.data // {} | to_entries[] | "export \(.key)=\(.value | @sh)"')"
              failed=0

              if [ -n "${DS_SUBNET_B:-}" ]; then sh -euc 'for i in $(seq 1 30); do out=$(aws ec2 delete-subnet --subnet-id $DS_SUBNET_B 2>&1) && exit 0; case "$out" in *DependencyViolation*) sleep 10 ;; *InvalidSubnetID.NotFound*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac; done; echo "$out" >&2; exit 1' || { echo "cleanup of DS_SUBNET_B failed" >&2; failed=1; }; fi

              if [ -n "${DS_SUBNET_A:-}" ]; then sh -euc 'for i in $(seq 1 30); do out=$(aws ec2 delete-subnet --subnet-id $DS_SUBNET_A 2>&1) && exit 0; case "$out" in *DependencyViolation*) sleep 10 ;; *InvalidSubnetID.NotFound*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac; done; echo "$out" >&2; exit 1' || { echo "cleanup of DS_SUBNET_A failed" >&2; failed=1; }; fi
              exit $failed
    - name: create-source
      try:
        - description: Create a VPCEndpoint to adopt, through a CR with deletion-policy retain
          apply:
            file: vpc-endpoint-adopt-source.yaml
    - name: wait-synced-source
      use:
        template: ../_templates/assert-synced.yaml
        with:
          bindings:
            - name: name
              value: vpc-endpoint-adopt-source
    - name: adopt
      try:
        - description: Record the AWS ID
          script:
            content: |-
              kubectl get vpcendpoint.ec2.services.k8s.aws vpc-endpoint-adopt-source -n "$NAMESPACE" -o jsonpath='{.status.vpcEndpointID}'
            outputs:
              - name: sourceID
                value: (trim_space($stdout))
        - description: Delete the CR, leaving the VPCEndpoint in AWS
          delete:
            ref:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPCEndpoint
              name: vpc-endpoint-adopt-source
        - description: Adopt the VPCEndpoint
          apply:
            file: vpc-endpoint-adopted.yaml
      cleanup:
        - description: Delete the VPCEndpoint if it's still in AWS
          script:
            env:
              - name: AWS_ID
                value: ($sourceID)
            content: |-
              aws ec2 delete-vpc-endpoints --vpc-endpoint-ids $AWS_ID >/dev/null 2>&1 || true
    - name: wait-synced
      use:
        template: ../_templates/assert-synced.yaml
    - name: check-adopted
      try:
        - description: Read back from AWS
          script:
            env:
              - name: AWS_ID
                value: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPCEndpoint', $namespace, $name).status.vpcEndpointID)
              - name: SUFFIX
                value: ($suffix)
              - name: REGION
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.REGION)
              - name: VPC_ID
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.VPC_ID)
              - name: VPC_IPV6_CIDR
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.VPC_IPV6_CIDR)
              - name: AZ_A
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.AZ_A)
              - name: AZ_B
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.AZ_B)
              - name: DS_SUBNET_A
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.DS_SUBNET_A)
              - name: DS_SUBNET_B
                value: (x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.DS_SUBNET_B)
            content: |-
              export AWS_DEFAULT_OUTPUT=json AWS_RETRY_MODE=adaptive
              # A call that fails prints its error, and leaves jq no JSON to read
              jq -n \
                --argjson describeVPCEndpoints "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID --query 'VpcEndpoints[0].{routeTableRefs: sort(RouteTableIds), serviceName: ServiceName, tags: sort_by(Tags[?!starts_with(Key, `"services.k8s.aws/"`)], &Key), systemTags: sort(Tags[?starts_with(Key, `"services.k8s.aws/"`)].Key), vpcEndpointType: VpcEndpointType, vpcRef: VpcId}')" \
                --argjson resource "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID --query 'VpcEndpoints[0]')" \
                '$ARGS.named'
            check:
              ($error): null
              (json_parse($stdout)):
                describeVPCEndpoints:
                  routeTableRefs: (sort([x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'RouteTable', $namespace, 'vpce-rt-a').status.routeTableID]))
                  serviceName: (join('', ['com.amazonaws.', x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.REGION, '.s3']))
                  systemTags:
                    - services.k8s.aws/controller-version
                    - services.k8s.aws/namespace
                  tags:
                    - Key: initialtagkey
                      Value: initialtagvalue
                  vpcEndpointType: Gateway
                  vpcRef: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPC', $namespace, 'vpce-vpc').status.vpcID)
                resource:
                  (json_parse(PolicyDocument)):
                    Statement:
                      - Action: '*'
                        Effect: Allow
                        Principal: '*'
                        Resource: '*'
                    Version: "2012-10-17"
      catch:
        - describe:
            apiVersion: ec2.services.k8s.aws/v1alpha1
            kind: VPCEndpoint
            name: ($name)
    - name: check-adopted-spec
      try:
        - description: Check the CR's spec was filled in from AWS
          script:
            content: |-
              kubectl get vpcendpoint.ec2.services.k8s.aws vpc-endpoint-adopted -n "$NAMESPACE" -o json
            check:
              ($error): null
              (json_parse($stdout)):
                metadata:
                  annotations:
                    services.k8s.aws/adopted: "true"
                spec:
                  (json_parse(policyDocument)):
                    Statement:
                      - Action: '*'
                        Effect: Allow
                        Principal: '*'
                        Resource: '*'
                    Version: "2012-10-17"
                  serviceName: (join('', ['com.amazonaws.', x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.REGION, '.s3']))
                  tags:
                    - key: initialtagkey
                      value: initialtagvalue
                  vpcEndpointType: Gateway
                  vpcID: (x_k8s_get($client, 'ec2.services.k8s.aws/v1alpha1', 'VPC', $namespace, 'vpce-vpc').status.vpcID)
    - name: delete
      use:
        template: ../_templates/delete.yaml
        with:
          bindings:
            - name: describeCommand
              value: aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID
            - name: notFoundCode
              value: InvalidVpcEndpointId.NotFound
