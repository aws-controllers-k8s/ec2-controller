              jq -n \
                --argjson describeVPCEndpoints "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID --query 'VpcEndpoints[0].{ipAddressType: IpAddressType, privateDNSEnabled: PrivateDnsEnabled, serviceName: ServiceName, subnetIDs: SubnetIds, vpcEndpointType: VpcEndpointType, vpcRef: VpcId}')" \
                --argjson resource "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids $AWS_ID --query 'VpcEndpoints[0]')" \
                '$ARGS.named'
            check:
              ($error): null
              (json_parse($stdout)):
                describeVPCEndpoints:
                  ipAddressType: ipv4
                  privateDNSEnabled: false
                  serviceName: (join('', ['com.amazonaws.', x_k8s_get($client, 'v1', 'ConfigMap', $namespace, 'ack-test-values').data.REGION, '.sqs']))
                  subnetIDs:
