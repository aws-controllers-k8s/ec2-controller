---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vpc-endpoint-service-configuration-gateway
spec:
  description: 'VPCEndpointServiceConfiguration lifecycle, variant gateway: Gateway load balancers instead of network ones; a service has one kind or the other.'
  bindings:
    - name: suffix
      value: (random('[a-z0-9]{8}'))
    - name: apiVersion
      value: ec2.services.k8s.aws/v1alpha1
    - name: kind
      value: VPCEndpointServiceConfiguration
    - name: name
      value: vpc-endpoint-service-configuration-gateway
    - name: idPath
      value: '{.status.serviceID}'
  steps:
    - name: dependencies
      try:
        - description: Create the VPC vpces-vpc it depends on
          apply:
            file: dependency-vpces-vpc.yaml
        - description: Wait for VPC vpces-vpc to be Synced
          assert:
            resource:
              apiVersion: ec2.services.k8s.aws/v1alpha1
              kind: VPC
              metadata:
                name: vpces-vpc
              status:
                (conditions[?type == 'ACK.ResourceSynced']):
                  - status: "True"
    - name: values
      try:
        - description: Work out the values the specs use
          script:
            env:
              - name: SUFFIX
                value: ($suffix)
            content: |
              set -eu
              export SUFFIX NAMESPACE AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
              kubectl create configmap ack-test-values -n "$NAMESPACE" >/dev/null

              ACCOUNT_ID=$(sh -euc 'aws sts get-caller-identity --query Account --output text') || { echo "value ACCOUNT_ID: command failed" >&2; exit 1; }
              [ -n "$ACCOUNT_ID" ] || { echo "value ACCOUNT_ID: command printed nothing" >&2; exit 1; }
              export ACCOUNT_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$ACCOUNT_ID" '{data: {ACCOUNT_ID: $v}}')" >/dev/null

              VPC_ID=$(sh -euc 'kubectl get vpc vpces-vpc -n $NAMESPACE -o jsonpath='\''{.status.vpcID}'\''') || { echo "value VPC_ID: command failed" >&2; exit 1; }
              [ -n "$VPC_ID" ] || { echo "value VPC_ID: command printed nothing" >&2; exit 1; }
              export VPC_ID
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$VPC_ID" '{data: {VPC_ID: $v}}')" >/dev/null

              VPC_IPV6_CIDR=$(sh -euc 'for i in $(seq 1 30); do cidr=$(kubectl get vpc vpces-vpc -n $NAMESPACE -o jsonpath='\''{.status.ipv6CIDRBlockAssociationSet[0].ipv6CIDRBlock}'\''); [ -n "$cidr" ] && echo "$cidr" && exit 0; sleep 2; done; exit 1') || { echo "value VPC_IPV6_CIDR: command failed" >&2; exit 1; }
              [ -n "$VPC_IPV6_CIDR" ] || { echo "value VPC_IPV6_CIDR: command printed nothing" >&2; exit 1; }
              export VPC_IPV6_CIDR
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$VPC_IPV6_CIDR" '{data: {VPC_IPV6_CIDR: $v}}')" >/dev/null

              AZ_A=$(sh -euc 'aws ec2 describe-availability-zones --filters Name=state,Values=available Name=zone-type,Values=availability-zone --query '\''sort(AvailabilityZones[].ZoneName)[0]'\'' --output text') || { echo "value AZ_A: command failed" >&2; exit 1; }
              [ -n "$AZ_A" ] || { echo "value AZ_A: command printed nothing" >&2; exit 1; }
              export AZ_A
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$AZ_A" '{data: {AZ_A: $v}}')" >/dev/null

              AZ_B=$(sh -euc 'aws ec2 describe-availability-zones --filters Name=state,Values=available Name=zone-type,Values=availability-zone --query '\''sort(AvailabilityZones[].ZoneName)[1]'\'' --output text') || { echo "value AZ_B: command failed" >&2; exit 1; }
              [ -n "$AZ_B" ] || { echo "value AZ_B: command printed nothing" >&2; exit 1; }
              export AZ_B
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$AZ_B" '{data: {AZ_B: $v}}')" >/dev/null

              SUBNET_A=$(sh -euc 'aws ec2 create-subnet --vpc-id $VPC_ID --availability-zone $AZ_A --cidr-block 10.0.1.0/24 --ipv6-cidr-block "$(echo "$VPC_IPV6_CIDR" | sed '\''s|00::/56$|01::/64|'\'')" --tag-specifications "ResourceType=subnet,Tags=[{Key=services.k8s.aws/namespace,Value=$NAMESPACE}]" --query Subnet.SubnetId --output text') || { echo "value SUBNET_A: command failed" >&2; exit 1; }
              [ -n "$SUBNET_A" ] || { echo "value SUBNET_A: command printed nothing" >&2; exit 1; }
              export SUBNET_A
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$SUBNET_A" '{data: {SUBNET_A: $v}}')" >/dev/null

              SUBNET_B=$(sh -euc 'aws ec2 create-subnet --vpc-id $VPC_ID --availability-zone $AZ_B --cidr-block 10.0.2.0/24 --ipv6-cidr-block "$(echo "$VPC_IPV6_CIDR" | sed '\''s|00::/56$|02::/64|'\'')" --tag-specifications "ResourceType=subnet,Tags=[{Key=services.k8s.aws/namespace,Value=$NAMESPACE}]" --query Subnet.SubnetId --output text') || { echo "value SUBNET_B: command failed" >&2; exit 1; }
              [ -n "$SUBNET_B" ] || { echo "value SUBNET_B: command printed nothing" >&2; exit 1; }
              export SUBNET_B
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$SUBNET_B" '{data: {SUBNET_B: $v}}')" >/dev/null

              LOAD_BALANCERS=$(sh -euc 'export AWS_RETRY_MODE=adaptive AWS_MAX_ATTEMPTS=10; tags="Key=services.k8s.aws/namespace,Value=$NAMESPACE"; arns=""; undo() { for a in $arns; do aws elbv2 delete-load-balancer --load-balancer-arn "$a" || true; done; exit 1; }; make() { a=$(aws elbv2 create-load-balancer --tags $tags --subnets $SUBNET_A $SUBNET_B "$@" --query '\''LoadBalancers[0].LoadBalancerArn'\'' --output text) || undo; arns="$arns $a"; }; make --name ack-chainsaw-n1-$SUFFIX --type network --scheme internal --ip-address-type dualstack; make --name ack-chainsaw-n2-$SUFFIX --type network --scheme internal --ip-address-type dualstack; make --name ack-chainsaw-g1-$SUFFIX --type gateway; make --name ack-chainsaw-g2-$SUFFIX --type gateway; aws elbv2 wait load-balancer-available --load-balancer-arns $arns || undo; echo $arns') || { echo "value LOAD_BALANCERS: command failed" >&2; exit 1; }
              [ -n "$LOAD_BALANCERS" ] || { echo "value LOAD_BALANCERS: command printed nothing" >&2; exit 1; }
              export LOAD_BALANCERS
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$LOAD_BALANCERS" '{data: {LOAD_BALANCERS: $v}}')" >/dev/null

              NLB_ARN=$(sh -euc 'echo "$LOAD_BALANCERS" | cut -d'\'' '\'' -f1') || { echo "value NLB_ARN: command failed" >&2; exit 1; }
              [ -n "$NLB_ARN" ] || { echo "value NLB_ARN: command printed nothing" >&2; exit 1; }
              export NLB_ARN
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$NLB_ARN" '{data: {NLB_ARN: $v}}')" >/dev/null

              NLB_ARN_2=$(sh -euc 'echo "$LOAD_BALANCERS" | cut -d'\'' '\'' -f2') || { echo "value NLB_ARN_2: command failed" >&2; exit 1; }
              [ -n "$NLB_ARN_2" ] || { echo "value NLB_ARN_2: command printed nothing" >&2; exit 1; }
              export NLB_ARN_2
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$NLB_ARN_2" '{data: {NLB_ARN_2: $v}}')" >/dev/null

              GWLB_ARN=$(sh -euc 'echo "$LOAD_BALANCERS" | cut -d'\'' '\'' -f3') || { echo "value GWLB_ARN: command failed" >&2; exit 1; }
              [ -n "$GWLB_ARN" ] || { echo "value GWLB_ARN: command printed nothing" >&2; exit 1; }
              export GWLB_ARN
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$GWLB_ARN" '{data: {GWLB_ARN: $v}}')" >/dev/null

              GWLB_ARN_2=$(sh -euc 'echo "$LOAD_BALANCERS" | cut -d'\'' '\'' -f4') || { echo "value GWLB_ARN_2: command failed" >&2; exit 1; }
              [ -n "$GWLB_ARN_2" ] || { echo "value GWLB_ARN_2: command printed nothing" >&2; exit 1; }
              export GWLB_ARN_2
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$GWLB_ARN_2" '{data: {GWLB_ARN_2: $v}}')" >/dev/null

              HOME_REGION=$(sh -euc 'echo "$AWS_REGION"') || { echo "value HOME_REGION: command failed" >&2; exit 1; }
              [ -n "$HOME_REGION" ] || { echo "value HOME_REGION: command printed nothing" >&2; exit 1; }
              export HOME_REGION
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$HOME_REGION" '{data: {HOME_REGION: $v}}')" >/dev/null

              OTHER_REGION=$(sh -euc '[ "$AWS_REGION" = us-east-1 ] && echo us-east-2 || echo us-east-1') || { echo "value OTHER_REGION: command failed" >&2; exit 1; }
              [ -n "$OTHER_REGION" ] || { echo "value OTHER_REGION: command printed nothing" >&2; exit 1; }
              export OTHER_REGION
              kubectl patch configmap ack-test-values -n "$NAMESPACE" --type merge -p "$(jq -n --arg v "$OTHER_REGION" '{data: {OTHER_REGION: $v}}')" >/dev/null
      cleanup:
        - description: Clean up what the values' commands created
          script:
            env:
              - name: SUFFIX
                value: ($suffix)
            content: |
              set -u
              export SUFFIX NAMESPACE AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
              eval "$(kubectl get configmap ack-test-values -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.data // {} | to_entries[] | "export \(.key)=\(.value | @sh)"')"
              failed=0

              if [ -n "${LOAD_BALANCERS:-}" ]; then sh -euc 'export AWS_RETRY_MODE=adaptive AWS_MAX_ATTEMPTS=10; for arn in $LOAD_BALANCERS; do aws elbv2 delete-load-balancer --load-balancer-arn "$arn"; done; aws elbv2 wait load-balancers-deleted --load-balancer-arns $LOAD_BALANCERS' || { echo "cleanup of LOAD_BALANCERS failed" >&2; failed=1; }; fi

              if [ -n "${SUBNET_B:-}" ]; then sh -euc 'for i in $(seq 1 30); do out=$(aws ec2 delete-subnet --subnet-id $SUBNET_B 2>&1) && exit 0; case "$out" in *DependencyViolation*) sleep 10 ;; *InvalidSubnetID.NotFound*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac; done; echo "$out" >&2; exit 1' || { echo "cleanup of SUBNET_B failed" >&2; failed=1; }; fi

              if [ -n "${SUBNET_A:-}" ]; then sh -euc 'for i in $(seq 1 30); do out=$(aws ec2 delete-subnet --subnet-id $SUBNET_A 2>&1) && exit 0; case "$out" in *DependencyViolation*) sleep 10 ;; *InvalidSubnetID.NotFound*) exit 0 ;; *) echo "$out" >&2; exit 1 ;; esac; done; echo "$out" >&2; exit 1' || { echo "cleanup of SUBNET_A failed" >&2; failed=1; }; fi
              exit $failed
    - name: create
      try:
        - description: Create the VPCEndpointServiceConfiguration
          apply:
